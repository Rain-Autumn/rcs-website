# Installed separately as raiju-site.service.d/zzz-security.conf after the
# dedicated account and writable directories have been prepared and backed up.
[Service]
User=rcs-site
Group=rcs-site
UMask=0077
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
ReadWritePaths=
ReadWritePaths=/var/lib/rcs/research-publications /var/lib/rcs/team-members /var/www/raijucloudsystem.com/current/.next/cache
MemoryHigh=512M
MemoryMax=768M
CPUQuota=100%
TasksMax=128
