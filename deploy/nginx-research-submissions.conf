# Place the limit zones in nginx.conf inside the http {} block.
limit_req_zone $binary_remote_addr zone=rcs_research_ip:10m rate=3r/h;
limit_conn_zone $binary_remote_addr zone=rcs_research_conn:10m;

# Place this location in the raijucloudsystem.com server {} block, before location /.
location = /api/research-publications {
    client_max_body_size 9m;
    client_body_timeout 15s;
    limit_req zone=rcs_research_ip burst=2 nodelay;
    limit_conn rcs_research_conn 2;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
}
