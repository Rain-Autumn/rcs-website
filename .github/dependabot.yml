version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    # The deployment and CI use Node 22; newer runtime types are not a runtime update.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
    # One weekly PR for all minor and patch updates: they share pnpm-lock.yaml,
    # so separate PRs had to be rebased and redeployed one by one. Majors stay separate.
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Brussels
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
