name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static audit
        run: pnpm test:static

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build
