allowBuilds:
  sharp: true
  unrs-resolver: true

# These exact plugins use @eslint/compat, not their unadapted rule API. Preserve
# their checks on ESLint 10; regression fixtures exercise every adapted family.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-import@2.32.0>eslint": "10.14.0"
    "eslint-plugin-jsx-a11y@6.10.2>eslint": "10.14.0"
    "eslint-plugin-react@7.37.5>eslint": "10.14.0"

overrides:
  browserslist: 4.28.7
  brace-expansion@^1.0.0: 1.1.21
  brace-expansion@^2.0.0: 2.1.7
  brace-expansion@^5.0.0: 5.0.12
  js-yaml: 4.3.2
  # Patched versions for GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249.
  glob@>=9.0.0 <14.0.2: 14.0.4
  minimatch@>=7.0.0 <11.0.1: 11.0.5
  postcss: 8.5.23
  # parser-stream 8.1 calls the tokenizer API introduced in parse5 8.1.
  parse5-parser-stream@8.1.0>parse5: 8.1.0
  sharp: 0.35.5
  source-map-js: 1.2.2
  undici@>=7.0.0 <8.0.0: 7.30.1
